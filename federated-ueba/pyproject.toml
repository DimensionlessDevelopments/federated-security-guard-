[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "federated-ueba"
version = "0.1.1"
description = "Federated learning for user and entity behaviour analytics"
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = [
    # `simulation` pulls in ray, required by the Flower Simulation Engine
    # (`flwr run . local-sim`).
    "flwr[agent,simulation]>=1.35.0,<2.0",
    "torch>=2.13.0",
    "numpy>=1.24.0",
    # Required by the Flower simulation engine (flwr run local-sim)
    "ray>=2.31.0",
    "pytest>=9.1.1",
    # LLM client for the incident-insights AgentApp
    "openai>=2.16.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["federated_ueba", "station_b"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not e2e'"
markers = [
    "e2e: full flwr simulation end-to-end test (entrypoint: pytest -m e2e)",
]

[tool.flwr.app]
publisher = "stevenrce0"
fab-include = [
    "federated_ueba/**/*.py",
    "station_b/**/*.py",
    "LICENSE",
    "README.md",
]

[tool.flwr.app.components]
serverapp = "federated_ueba.federated.server:app"
# Dispatcher routes partitions to the ML StationClient or the non-ML
# StationBClient. server.py and client.py are unchanged.
clientapp = "federated_ueba.federated.client_dispatch:app"
# NOTE: registering `agentapp` changes what `flwr run` executes -- Flower
# runs the AgentApp INSTEAD of the server/client training pipeline
# (control_handlers: AGENT_APP if "agentapp" in components else SERVER_APP).
# Uncomment only for agent runs / `flwr chat`; keep commented for training.
# agentapp = "federated_ueba.agent.agent_app:app"

[tool.flwr.app.config]
# Model dimensions -- input-dim must match the 11-feature UEBA schema
# (FEATURE_NAMES in federated_ueba.data.generator).
input-dim = 11
hidden-dim = 32
latent-dim = 8

num-server-rounds = 5

fraction-train = 1.0
fraction-evaluate = 1.0

learning-rate = 0.001
local-epochs = 2

global-model-path = "artifacts/global_model.pt"

# Station B (non-ML node): synthetic events observed per round.
station-b-events = 500

[tool.flwr.app.config.agent]
model = "openai/gpt-5.6-sol"
station = "central_helpdesk"

# NOTE: `flwr run` (v1.35) may rewrite/re-comment this block via its config
# migration. It defines the local-sim federation, so keep it uncommented to
# run the simulation. ray is provided via the flwr[simulation] dependency.

